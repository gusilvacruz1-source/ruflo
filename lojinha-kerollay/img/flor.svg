<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 1308" width="736" height="1308" role="img" aria-label="Camélia rosa em aquarela">
  <defs>
    <linearGradient id="pPale" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#fbe2e8"/>
      <stop offset="42%" stop-color="#f3bccb"/>
      <stop offset="100%" stop-color="#dd8ea3"/>
    </linearGradient>
    <linearGradient id="pPale2" x1=".9" y1="0" x2=".1" y2="1">
      <stop offset="0%" stop-color="#f9dbe3"/>
      <stop offset="48%" stop-color="#efb2c4"/>
      <stop offset="100%" stop-color="#d78ba1"/>
    </linearGradient>
    <linearGradient id="pDeep" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0%" stop-color="#e3a0b3"/>
      <stop offset="45%" stop-color="#cf7189"/>
      <stop offset="100%" stop-color="#b45770"/>
    </linearGradient>
    <linearGradient id="pSoft" x1="0" y1=".2" x2="1" y2=".9">
      <stop offset="0%" stop-color="#fae6ec"/>
      <stop offset="55%" stop-color="#f2c2ce"/>
      <stop offset="100%" stop-color="#e09fb2"/>
    </linearGradient>
    <linearGradient id="lfDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d7a58"/>
      <stop offset="38%" stop-color="#3c5a3c"/>
      <stop offset="100%" stop-color="#22381f"/>
    </linearGradient>
    <linearGradient id="lfMid" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ba474"/>
      <stop offset="45%" stop-color="#5d7c53"/>
      <stop offset="100%" stop-color="#3a5535"/>
    </linearGradient>
    <linearGradient id="lfOlive" x1=".2" y1="0" x2=".9" y2="1">
      <stop offset="0%" stop-color="#7c8a55"/>
      <stop offset="50%" stop-color="#55663c"/>
      <stop offset="100%" stop-color="#33421f"/>
    </linearGradient>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7d4a2a"/>
      <stop offset="42%" stop-color="#b1703f"/>
      <stop offset="100%" stop-color="#6d3f24"/>
    </linearGradient>
    <filter id="aquarela" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="4" seed="7" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="papel" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer result="g"><feFuncA type="linear" slope=".2"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="g" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#papel)">
  <g filter="url(#aquarela)">

    <!-- ===== FOLHAS DE TRÁS ===== -->
    <!-- folha alta, à esquerda -->
    <path d="M248 58 C 344 132, 406 236, 404 340 C 330 330, 268 218, 248 58 Z" fill="url(#lfMid)"/>
    <path d="M248 58 C 296 178, 350 272, 404 340" stroke="#cfdcb8" stroke-width="4" fill="none" opacity=".4"/>
    <!-- folha oliva, à direita -->
    <path d="M560 116 C 540 176, 482 238, 424 306 C 412 202, 470 130, 560 116 Z" fill="url(#lfOlive)"/>
    <path d="M560 116 C 500 168, 452 240, 424 306" stroke="#c6cf9e" stroke-width="3.5" fill="none" opacity=".38"/>

    <!-- ===== CAULE ===== -->
    <path d="M366 474 C 424 548, 452 652, 454 772 C 456 906, 424 1064, 380 1218 C 368 1262, 360 1290, 356 1308"
          stroke="url(#stemG)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M366 474 C 424 548, 452 652, 454 772 C 456 906, 424 1064, 380 1218 C 368 1262, 360 1290, 356 1308"
          stroke="#e8bd90" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".32"/>

    <!-- ===== FOLHAS DO CAULE ===== -->
    <!-- pequena, à esquerda do caule -->
    <path d="M388 548 C 432 574, 456 608, 460 646 C 412 636, 388 598, 380 560 Z" fill="url(#lfMid)"/>
    <!-- pequena, à direita do caule -->
    <path d="M450 574 C 498 556, 542 566, 572 594 C 526 626, 476 616, 446 594 Z" fill="url(#lfDark)"/>

    <!-- folha grande esquerda -->
    <path d="M48 582 C 198 598, 352 748, 404 942 C 262 900, 104 750, 48 582 Z" fill="url(#lfDark)"/>
    <path d="M48 582 C 160 668, 300 812, 404 942" stroke="#cfdcb8" stroke-width="4.5" fill="none" opacity=".42"/>

    <!-- folha grande direita -->
    <path d="M706 826 C 682 946, 544 1082, 420 1142 C 488 952, 592 852, 706 826 Z" fill="url(#lfDark)"/>
    <path d="M706 826 C 618 916, 500 1042, 420 1142" stroke="#cfdcb8" stroke-width="4.5" fill="none" opacity=".42"/>

    <!-- folha inferior esquerda -->
    <path d="M196 1006 C 300 1050, 374 1156, 392 1256 C 272 1224, 208 1110, 196 1006 Z" fill="url(#lfMid)"/>
    <path d="M196 1006 C 268 1096, 340 1180, 392 1256" stroke="#cfdcb8" stroke-width="4" fill="none" opacity=".38"/>

    <!-- ===== PÉTALAS ===== -->
    <!-- inferior -->
    <path d="M300 424 C 306 484, 296 528, 262 552 C 306 562, 346 532, 358 486 C 356 452, 332 428, 306 418 Z" fill="url(#pSoft)"/>
    <!-- inferior esquerda -->
    <path d="M288 434 C 232 470, 168 490, 128 522 C 166 550, 240 546, 290 512 C 306 488, 304 458, 294 438 Z" fill="url(#pPale2)"/>
    <!-- esquerda -->
    <path d="M292 404 C 238 382, 166 368, 106 386 C 62 400, 58 434, 92 464 C 144 492, 224 470, 288 434 Z" fill="url(#pPale)"/>
    <!-- superior esquerda, mais escura -->
    <path d="M296 400 C 268 328, 240 268, 212 234 C 186 264, 172 322, 186 376 C 208 404, 256 412, 294 408 Z" fill="url(#pDeep)"/>
    <!-- superior direita, grande -->
    <path d="M300 406 C 306 320, 352 248, 426 230 C 480 244, 508 300, 500 358 C 470 394, 388 414, 320 420 Z" fill="url(#pPale)"/>
    <!-- direita inferior -->
    <path d="M318 418 C 396 418, 466 400, 498 366 C 508 420, 464 474, 398 484 C 356 482, 328 454, 314 430 Z" fill="url(#pPale2)"/>

    <!-- veios das pétalas -->
    <g stroke="#b8556e" stroke-width="2.2" fill="none" opacity=".26" stroke-linecap="round">
      <path d="M306 402 C 322 336, 366 274, 428 244"/>
      <path d="M306 404 C 336 350, 390 300, 458 274"/>
      <path d="M310 412 C 372 410, 442 396, 492 366"/>
      <path d="M312 424 C 372 434, 428 448, 462 468"/>
      <path d="M296 400 C 268 340, 244 288, 218 250"/>
      <path d="M292 406 C 232 390, 158 380, 104 394"/>
      <path d="M290 424 C 236 460, 178 486, 140 516"/>
      <path d="M300 430 C 300 476, 292 516, 268 544"/>
    </g>

    <!-- ===== CÁLICE ===== -->
    <path d="M312 428 C 348 442, 378 476, 392 518 C 356 512, 326 484, 306 448 Z" fill="#9a6a3c"/>
    <path d="M330 444 C 372 462, 402 500, 410 540 C 372 530, 340 496, 322 458 Z" fill="url(#lfOlive)"/>

    <!-- ===== ESTAMES ===== -->
    <g stroke="#e0a028" stroke-width="3.4" stroke-linecap="round" opacity=".95">
      <path d="M300 442 L 252 372"/><path d="M300 442 L 272 362"/><path d="M300 442 L 296 356"/>
      <path d="M300 442 L 320 364"/><path d="M300 442 L 344 380"/><path d="M300 442 L 238 400"/>
      <path d="M300 442 L 246 428"/><path d="M300 442 L 356 410"/><path d="M300 442 L 268 388"/>
    </g>
    <g fill="#f7cf4e">
      <circle cx="250" cy="368" r="6.5"/><circle cx="270" cy="358" r="6.5"/><circle cx="296" cy="352" r="6.5"/>
      <circle cx="322" cy="360" r="6.5"/><circle cx="346" cy="377" r="6.5"/><circle cx="235" cy="399" r="6.5"/>
      <circle cx="243" cy="427" r="6.5"/><circle cx="359" cy="408" r="6.5"/><circle cx="265" cy="385" r="6"/>
    </g>
    <ellipse cx="300" cy="444" rx="15" ry="11" fill="#c58a3a"/>

  </g>
  </g>
</svg>
