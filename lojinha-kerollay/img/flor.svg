<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 1300" width="740" height="1300" role="img" aria-label="Flor rosa em aquarela">
  <defs>
    <linearGradient id="petalA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6bfd0"/>
      <stop offset="55%" stop-color="#eb92ae"/>
      <stop offset="100%" stop-color="#c9556f"/>
    </linearGradient>
    <linearGradient id="petalB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fadbe4"/>
      <stop offset="60%" stop-color="#f0a2ba"/>
      <stop offset="100%" stop-color="#d06d84"/>
    </linearGradient>
    <linearGradient id="petalC" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c04c68"/>
      <stop offset="45%" stop-color="#e78ea8"/>
      <stop offset="100%" stop-color="#f8ccda"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5c7a55"/>
      <stop offset="50%" stop-color="#3f5c3c"/>
      <stop offset="100%" stop-color="#25391f"/>
    </linearGradient>
    <linearGradient id="leafB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d8a60"/>
      <stop offset="55%" stop-color="#43613e"/>
      <stop offset="100%" stop-color="#2b4326"/>
    </linearGradient>
    <linearGradient id="stemG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8d5f3a"/>
      <stop offset="45%" stop-color="#a8703f"/>
      <stop offset="100%" stop-color="#5f3f27"/>
    </linearGradient>
    <radialGradient id="glowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer result="g"><feFuncA type="linear" slope=".16"/></feComponentTransfer>
      <feComposite in="SourceGraphic" in2="g" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <!-- caule -->
    <path d="M405 470 C 400 640, 372 800, 336 950 C 306 1075, 288 1180, 282 1288"
          stroke="url(#stemG)" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M405 470 C 400 640, 372 800, 336 950 C 306 1075, 288 1180, 282 1288"
          stroke="#e8c9a0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity=".35"/>

    <!-- folha grande esquerda -->
    <path d="M352 880 C 250 830, 140 750, 62 622 C 190 640, 300 720, 356 856 Z" fill="url(#leafA)"/>
    <path d="M352 880 C 262 838, 168 762, 84 640" stroke="#c9dcb6" stroke-width="3" fill="none" opacity=".45"/>

    <!-- folha grande direita -->
    <path d="M330 1010 C 452 986, 574 1030, 686 1140 C 552 1178, 420 1140, 322 1044 Z" fill="url(#leafB)"/>
    <path d="M330 1010 C 448 1004, 566 1052, 664 1136" stroke="#cfe0bd" stroke-width="3" fill="none" opacity=".45"/>

    <!-- folhas do cálice -->
    <path d="M410 480 C 470 452, 546 424, 618 428 C 560 494, 480 522, 414 512 Z" fill="url(#leafB)"/>
    <path d="M398 470 C 386 520, 372 570, 348 612 C 336 548, 348 496, 380 462 Z" fill="url(#leafA)"/>
    <path d="M404 452 C 448 440, 486 448, 512 470 C 470 486, 428 482, 398 464 Z" fill="#3f5c3c"/>
    <path d="M398 456 C 372 424, 356 388, 358 352 C 392 382, 408 418, 408 452 Z" fill="url(#leafA)"/>

    <!-- pétalas de trás -->
    <path d="M392 300 C 300 214, 176 206, 96 268 C 168 356, 286 388, 386 336 Z" fill="url(#petalB)" opacity=".92"/>
    <path d="M406 274 C 388 168, 300 84, 196 78 C 214 190, 288 268, 396 300 Z" fill="url(#petalC)" opacity=".9"/>

    <!-- pétalas frontais -->
    <path d="M414 306 C 350 226, 348 118, 424 52 C 492 122, 500 232, 438 320 Z" fill="url(#petalA)"/>
    <path d="M434 316 C 512 254, 618 260, 674 336 C 594 396, 486 386, 428 336 Z" fill="url(#petalB)"/>
    <path d="M426 342 C 494 372, 552 452, 540 542 C 452 512, 404 436, 410 350 Z" fill="url(#petalC)"/>
    <path d="M400 344 C 352 400, 336 470, 356 540 C 300 486, 292 400, 340 336 Z" fill="url(#petalA)" opacity=".85"/>

    <!-- veios das pétalas -->
    <g stroke="#a83e5c" stroke-width="2" fill="none" opacity=".3" stroke-linecap="round">
      <path d="M418 320 C 404 250, 408 160, 428 88"/>
      <path d="M432 328 C 500 296, 578 292, 646 328"/>
      <path d="M424 342 C 470 392, 508 452, 520 518"/>
      <path d="M398 330 C 344 292, 270 276, 190 288"/>
    </g>

    <!-- centro -->
    <circle cx="416" cy="330" r="62" fill="url(#glowC)" filter="url(#soft)"/>
    <g stroke="#e8a324" stroke-width="4" stroke-linecap="round">
      <path d="M416 330 L 390 276"/><path d="M416 330 L 416 268"/><path d="M416 330 L 444 274"/>
      <path d="M416 330 L 464 292"/><path d="M416 330 L 368 292"/><path d="M416 330 L 470 330"/>
      <path d="M416 330 L 362 334"/><path d="M416 330 L 442 380"/><path d="M416 330 L 392 378"/>
    </g>
    <g fill="#ffd257">
      <circle cx="390" cy="274" r="6"/><circle cx="416" cy="266" r="6"/><circle cx="445" cy="272" r="6"/>
      <circle cx="466" cy="290" r="6"/><circle cx="366" cy="290" r="6"/><circle cx="472" cy="330" r="6"/>
      <circle cx="360" cy="334" r="6"/><circle cx="444" cy="382" r="6"/><circle cx="390" cy="380" r="6"/>
    </g>
    <circle cx="416" cy="330" r="13" fill="#c4762a"/>
  </g>
</svg>
