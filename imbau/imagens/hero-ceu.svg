  <rect width="2400" height="1350" fill="url(#sky)"/>
  <ellipse cx="2337.6" cy="206.9" rx="692.2" ry="44.5" fill="#8aa2bb" opacity="0.1" filter="url(#blurLg)"/><ellipse cx="396.9" cy="349.6" rx="1009.9" ry="43.4" fill="#8aa2bb" opacity="0.1" filter="url(#blurLg)"/><ellipse cx="1171.0" cy="499.3" rx="828.6" ry="30.0" fill="#8aa2bb" opacity="0.1" filter="url(#blurLg)"/><ellipse cx="857.6" cy="621.8" rx="700.6" ry="62.1" fill="#8aa2bb" opacity="0.1" filter="url(#blurLg)"/>
  <rect width="2400" height="1350" fill="url(#sun)"/>
