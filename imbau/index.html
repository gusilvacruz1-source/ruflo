    <!--
      Ficha da empresa para o Google ler direto do site: nome, endereço e
      telefone iguais aos do perfil no Google Meu Negócio. As avaliações não
      entram aqui de propósito — elas são do Google, e marcar avaliação de
      terceiro como se fosse do site vai contra as regras dele.
      Falta o horário completo: quando a Raquel confirmar, acrescente
      "openingHoursSpecification".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Imobiliária Imbaú",
        "url": "https://imobiliariaimbau.com.br/",
        "image": "https://imobiliariaimbau.com.br/imagens/og.jpg",
        "telephone": "+5542988369168",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Tv. Pio XII, nº 93",
          "addressLocality": "Imbaú",
          "addressRegion": "PR",
          "postalCode": "84250-000",
          "addressCountry": "BR"
        },
        "areaServed": "Imbaú e região, Paraná",
        "sameAs": ["https://www.instagram.com/imobiliaria.imbau/"]
      }
    </script>
